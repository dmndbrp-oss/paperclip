<!-- Sanitized field-shape fixture derived from SAG-7864's attached SSI login DOM. -->
<form class="login-form">
  <input autocomplete="off" data-testid="userName" id="ssi_userName" class="dx-texteditor-input" type="text" name="userName" role="textbox" aria-required="true">
  <input autocomplete="off" data-testid="password" id="ssi_password" class="dx-texteditor-input" type="password" name="password" role="textbox" aria-required="true">
  <input type="hidden" name="rememberMe" value="">
  <div class="dx-button" role="button" data-testid="submit">
    <input class="dx-button-submit-input" type="submit" value="">
  </div>
</form>
